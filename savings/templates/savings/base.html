<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10251d">
<title>{% block title %}Sancta Maria Agency{% endblock %}</title>
<style>
:root{color-scheme:light;--green:#173d2d;--green-2:#245b42;--ink:#17231d;--muted:#718078;--bg:#f4f7f4;--line:#e2e9e3;--white:#fff;--red:#b42318;--shadow:0 18px 55px rgba(21,48,34,.09)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
a{color:var(--green-2);text-decoration:none}a:hover{text-decoration:underline}
header{min-height:72px;padding:0 clamp(18px,5vw,64px);display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--green);color:#fff}
.brand{display:flex;align-items:center;gap:12px;color:#fff!important;font-weight:700;letter-spacing:-.02em;font-size:1.03rem}
.brand-mark{height:36px;width:36px;border:1px solid rgba(255,255,255,.38);border-radius:11px;display:grid;place-items:center;font-size:.78rem;letter-spacing:.06em}
header nav{display:flex;align-items:center;gap:22px}header nav a{color:#e7f0e9;font-size:.9rem;font-weight:550}
header form{margin:0}button,.btn{border:0;border-radius:9px;background:var(--green);color:#fff;padding:11px 17px;font:inherit;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .18s,transform .18s;text-decoration:none}
button:hover,.btn:hover{background:var(--green-2);transform:translateY(-1px);text-decoration:none}
button.red{background:#b42318}button.red:hover{background:#921d15}button.link{background:none;color:#fff;padding:7px 0}
main{max-width:1120px;margin:34px auto;padding:0 22px 52px}
h1,h2,h3{margin:0 0 12px;line-height:1.2;letter-spacing:-.035em}h1{font-size:clamp(1.8rem,4vw,2.45rem)}h2{font-size:1.55rem}h3{font-size:1.12rem}
p{color:#64736a;margin:8px 0 18px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 5px 22px rgba(23,61,45,.035)}
.big{font-size:2rem;font-weight:750;letter-spacing:-.04em;color:var(--green);font-variant-numeric:tabular-nums}
label{display:block;font-size:.87rem;font-weight:650;color:#34483b;margin-bottom:7px}
input,select{width:100%;min-height:46px;padding:10px 13px;border:1px solid #d6e0d8;border-radius:9px;background:#fff;color:var(--ink);font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus{border-color:#4d8063;box-shadow:0 0 0 3px rgba(36,91,66,.11)}
input::placeholder{color:#a1aca5}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}th{background:#f5f8f5;color:#52645a;font-size:.78rem;text-transform:uppercase;letter-spacing:.055em;font-weight:700}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.hit td{background:#f0f7f1;font-weight:650}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:11px}.scroll table{min-width:560px}.err{color:var(--red);font-size:.82rem}.msg{padding:12px 15px;border:1px solid #cce3d1;border-radius:10px;margin-bottom:14px;background:#eef8f0;color:#245b36}.msg.error{background:#fff1f0;border-color:#f5d0cc;color:#a52820}
.auth-main{min-height:calc(100vh - 72px);display:grid;place-items:center;padding-top:34px;padding-bottom:55px}
.auth-shell{width:min(100%,440px);margin:auto}
.auth-card{background:#fff;border:1px solid #e4ebe5;border-radius:20px;padding:clamp(25px,5vw,38px);box-shadow:var(--shadow)}
.auth-brand{height:46px;width:46px;display:grid;place-items:center;border-radius:14px;background:#edf4ee;color:var(--green);font-weight:800;letter-spacing:.04em;margin-bottom:25px}
.auth-eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.13em;color:#718078;font-weight:750;margin:0 0 9px}
.auth-card h1{font-size:1.85rem;margin-bottom:8px}.auth-subtitle{font-size:.94rem;color:var(--muted);margin:0 0 27px}
.auth-form p{margin:0 0 18px}.auth-form button{width:100%;min-height:48px;margin-top:7px}
.auth-foot{font-size:.86rem;text-align:center;color:var(--muted);margin:20px 0 0}.auth-foot a{font-weight:650}
.home-hero{max-width:780px;margin:7vh auto 0;text-align:center;padding:clamp(32px,7vw,76px) 25px;background:linear-gradient(145deg,#fff,#f7faf7);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.home-mark{width:58px;height:58px;margin:0 auto 22px;border-radius:18px;background:#edf4ee;color:var(--green);display:grid;place-items:center;font-weight:800;letter-spacing:.05em}
.home-hero p{max-width:480px;margin:0 auto 28px}.home-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn.secondary{background:#edf3ee;color:var(--green)}.btn.secondary:hover{background:#dfeae1}
@media(max-width:640px){header{min-height:64px;padding:12px 18px}header nav{gap:12px}main{padding-left:15px;padding-right:15px;margin-top:22px}.card{padding:18px;border-radius:13px}.auth-main{min-height:calc(100vh - 64px);padding:24px 15px 40px}.auth-card{border-radius:16px}.row>div{min-width:100%}.home-hero{margin-top:3vh}}
@media print{header,form,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<header>
<a class="brand" href="{% url 'home' %}"><span class="brand-mark">SM</span><span>Sancta Maria Agency</span></a>
<nav>
{% if request.user.is_staff %}<a href="{% url 'owner_dashboard' %}">Dashboard</a>
<form method="post" action="{% url 'owner_logout' %}">{% csrf_token %}<button class="link">Log out</button></form>
{% elif request.session.customer_id %}<form method="post" action="{% url 'customer_logout' %}">{% csrf_token %}<button class="link">Log out</button></form>{% endif %}
</nav>
</header>
<main class="{% block main_class %}{% endblock %}">
{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body></html>
